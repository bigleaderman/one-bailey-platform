version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: onebailey-postgres-dev
    environment:
      POSTGRES_DB: onebailey
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qlalfdla1234!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - onebailey-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d onebailey"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onebailey-backend-dev
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=onebailey
      - DB_USER=admin
      - DB_PASSWORD=qlalfdla1234!
      - USE_REAL_DB=false
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - onebailey-network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onebailey-frontend-dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - onebailey-network

networks:
  onebailey-network:
    driver: bridge

volumes:
  postgres_data:
