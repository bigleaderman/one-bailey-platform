version: '3.8'

services:
  # PostgreSQL Database (로컬 개발용)
  postgres:
    image: postgres:15-alpine
    container_name: onebailey-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: onebailey
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - onebailey-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d onebailey"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (로컬 빌드)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onebailey-backend-dev
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: onebailey
      DB_USER: admin
      DB_PASSWORD: devpassword
      USE_REAL_DB: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app  # 핫 리로드를 위한 볼륨 마운트
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - onebailey-dev-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (로컬 빌드)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onebailey-frontend-dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - onebailey-dev-network

networks:
  onebailey-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
