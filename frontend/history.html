<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneBailey - 예측 히스토리</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="history.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <a href="/" class="back-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <h1 class="header-title">예측 히스토리</h1>
            <div style="width:40px"></div>
        </header>

        <main class="main-content">
            <!-- 통계 요약 -->
            <section class="stats-card">
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="statTotal">-</span>
                        <span class="stat-label">전체</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="statCorrect">-</span>
                        <span class="stat-label">적중</span>
                    </div>
                    <div class="stat-item highlight">
                        <span class="stat-value" id="statAccuracy">-</span>
                        <span class="stat-label">적중률</span>
                    </div>
                </div>
            </section>

            <!-- 월별 필터 -->
            <section class="filter-section">
                <select id="monthFilter" class="month-select">
                    <option value="">전체 기간</option>
                </select>
            </section>

            <!-- 기록 리스트 -->
            <section class="history-list" id="historyList">
                <div class="loading-text">로딩 중...</div>
            </section>
        </main>

        <footer class="footer">
            <p>본 정보는 투자 참고용이며, 투자 손실에 대한 책임은 투자자 본인에게 있습니다.</p>
            <p>&copy; 2025 OneBailey. All rights reserved.</p>
        </footer>
    </div>

    <script src="history.js"></script>
</body>
</html>
