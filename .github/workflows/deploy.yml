name: Build and Deploy

on:
  push:
    branches:
      - 'claude/*'
      - dev
      - main

env:
  DOCKER_HUB_USERNAME: sosohan
  DOCKER_HUB_REPO: onebaileyplatform
  VM_HOST: 183.111.67.145
  VM_PORT: 22302
  VM_USERNAME: root

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract branch name
        id: extract_branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          # Sanitize branch name for docker tag (replace / with -)
          TAG_NAME=$(echo $BRANCH_NAME | sed 's/\//-/g')
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:backend-${{ steps.extract_branch.outputs.tag }}
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:backend-latest
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:backend-cache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:backend-cache,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:frontend-${{ steps.extract_branch.outputs.tag }}
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:frontend-latest
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:frontend-cache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:frontend-cache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USERNAME }}
          port: ${{ env.VM_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/one-bailey-platform

            # Pull latest changes
            git pull origin ${{ github.ref_name }}

            # Pull latest Docker images
            docker pull ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:backend-latest
            docker pull ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_REPO }}:frontend-latest

            # Restart services
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d

            # Clean up old images
            docker image prune -af

            echo "Deployment completed successfully!"
