name: Build and Deploy

on:
  push:
    branches: [dev, main]

env:
  DOCKER_USERNAME: sosohan
  DOCKER_IMAGE: sosohan/onebaileyplatform
  SERVER_HOST: 183.111.67.145
  SERVER_PORT: 22302
  SERVER_USER: root
  DEPLOY_PATH: /fscm/onebailey/app

jobs:
  # ========================================
  # 변경된 파일 감지
  # ========================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ========================================
  # Build Backend (backend 폴더 변경 시에만)
  # ========================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:backend-latest
            ${{ env.DOCKER_IMAGE }}:backend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Build Frontend (frontend 폴더 변경 시에만)
  # ========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:frontend-latest
            ${{ env.DOCKER_IMAGE }}:frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Deploy to Server (변경된 것만 배포)
  # ========================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [changes, build-backend, build-frontend]
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.SERVER_PORT }} ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy docker-compose to server
        run: |
          scp -P ${{ env.SERVER_PORT }} docker-compose.prod.yml ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.yml

      - name: Deploy
        run: |
          ssh -p ${{ env.SERVER_PORT }} ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'
            cd /fscm/onebailey/app
            
            # Docker 로그인
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u sosohan --password-stdin
            
            # 네트워크 생성 (없으면)
            docker network create onebailey-network 2>/dev/null || true
            
            # postgres-db를 네트워크에 연결 (없으면)
            docker network connect onebailey-network postgres-db 2>/dev/null || true
            
            # 변경된 이미지만 pull
            if [ "${{ needs.changes.outputs.backend }}" == "true" ]; then
              echo "📦 Pulling Backend..."
              docker pull sosohan/onebaileyplatform:backend-latest
            fi
            
            if [ "${{ needs.changes.outputs.frontend }}" == "true" ]; then
              echo "📦 Pulling Frontend..."
              docker pull sosohan/onebaileyplatform:frontend-latest
            fi
            
            # 컨테이너 재시작
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose up -d
            
            # Nginx 재시작 (Backend IP 갱신)
            cd /fscm/onebailey/nginx
            docker compose restart nginx
            
            # 정리
            docker image prune -f
            
            # 상태 확인
            echo ""
            echo "=== Container Status ==="
            docker ps | grep onebailey
            
            echo ""
            echo "=== Health Check ==="
            sleep 5
            curl -sk https://localhost/api/predictions/today > /dev/null && echo "✅ API OK" || echo "❌ API Failed"
            curl -sk https://localhost/ > /dev/null && echo "✅ Frontend OK" || echo "❌ Frontend Failed"
          ENDSSH