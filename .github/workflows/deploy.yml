name: Build and Deploy

on:
  push:
    branches: [dev, main]

env:
  DOCKER_USERNAME: sosohan
  DOCKER_IMAGE: sosohan/onebaileyplatform
  SERVER_HOST: 183.111.67.145
  SERVER_PORT: 22302
  SERVER_USER: root
  DEPLOY_PATH: /fscm/onebailey

jobs:
  # ========================================
  # Build Backend
  # ========================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:backend-latest
            ${{ env.DOCKER_IMAGE }}:backend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Build Frontend
  # ========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:frontend-latest
            ${{ env.DOCKER_IMAGE }}:frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Deploy to Server
  # ========================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.SERVER_PORT }} ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy docker-compose to server
        run: |
          scp -P ${{ env.SERVER_PORT }} docker-compose.prod.yml ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.yml

      - name: Deploy
        run: |
          ssh -p ${{ env.SERVER_PORT }} ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'
            cd /fscm/onebailey
            
            # Docker 로그인
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u sosohan --password-stdin
            
            # 네트워크 생성 (없으면)
            docker network create onebailey-network 2>/dev/null || true
            
            # postgres-db를 네트워크에 연결 (없으면)
            docker network connect onebailey-network postgres-db 2>/dev/null || true
            
            # 최신 이미지 pull
            docker pull sosohan/onebaileyplatform:backend-latest
            docker pull sosohan/onebaileyplatform:frontend-latest
            
            # 기존 컨테이너 중지 및 삭제
            docker compose down --remove-orphans 2>/dev/null || true
            
            # 새 컨테이너 시작
            docker compose up -d
            
            # 정리
            docker image prune -f
            
            # 상태 확인
            echo "=== Container Status ==="
            docker compose ps
            
            echo ""
            echo "=== Health Check ==="
            sleep 5
            curl -sf http://localhost:8000/ && echo "✅ Backend OK" || echo "❌ Backend Failed"
            curl -sf http://localhost:80 && echo "✅ Frontend OK" || echo "❌ Frontend Failed"
          ENDSSH
