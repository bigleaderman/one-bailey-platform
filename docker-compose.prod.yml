# ============================================
# 앱 배포용 docker-compose (Backend + Frontend)
# GitHub Actions 배포 대상
# 경로: /fscm/onebailey/app/
# ============================================

services:
  backend:
    image: sosohan/onebaileyplatform:backend-latest
    container_name: onebailey-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres-db
      DB_PORT: "5432"
      DB_NAME: onebailey
      DB_USER: admin
      DB_PASSWORD: "${DB_PASSWORD}"
    expose:
      - "8000"
    networks:
      - onebailey-network

  frontend:
    image: sosohan/onebaileyplatform:frontend-latest
    container_name: onebailey-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - onebailey-network

networks:
  onebailey-network:
    external: true