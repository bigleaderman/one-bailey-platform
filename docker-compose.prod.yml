# ============================================
# 서버 배포용 docker-compose
# 서버 DB (postgres-db 컨테이너)와 같은 네트워크 사용
# ============================================

services:
  # Backend (FastAPI)
  backend:
    image: sosohan/onebaileyplatform:backend-latest
    container_name: onebailey-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres-db
      DB_PORT: "5432"
      DB_NAME: onebailey
      DB_USER: admin
      DB_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "8000:8000"
    networks:
      - onebailey-network

  # Frontend
  frontend:
    image: sosohan/onebaileyplatform:frontend-latest
    container_name: onebailey-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - onebailey-network

networks:
  onebailey-network:
    external: true
