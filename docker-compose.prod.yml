version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: onebailey-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-onebailey}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - onebailey-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-onebailey}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: sosohan/onebaileyplatform:backend-latest
    container_name: onebailey-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-onebailey}
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - USE_REAL_DB=${USE_REAL_DB:-false}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - onebailey-network
    restart: unless-stopped

  # Frontend
  frontend:
    image: sosohan/onebaileyplatform:frontend-latest
    container_name: onebailey-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - onebailey-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: onebailey-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - onebailey-network
    restart: unless-stopped

networks:
  onebailey-network:
    driver: bridge

volumes:
  postgres_data:
